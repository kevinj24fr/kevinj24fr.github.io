<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* kevinj24fr.github.io — "specimen". Plain CSS, no build step. */

@font-face { font-family: "Plex Sans"; src: url("../../assets/fonts/IBMPlexSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Sans"; src: url("../../assets/fonts/IBMPlexSans-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Plex Sans"; src: url("../../assets/fonts/IBMPlexSans-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Sans"; src: url("../../assets/fonts/IBMPlexSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url("../../assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url("../../assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

:root {
  --paper: #f5f4ef; --paper-2: #ecebe4;
  --ink: #16181a; --ink-2: #3b3f45; --mute: #6e737a; --rule: #d8d7cf;
  --rust: #2b7a4b;            /* Iba1 green, text weight */
  --rust-soft: #e2f1e6;
  --glow: #8ff0aa;            /* Iba1 green, fluorescence weight */
  --code-bg: #101315; --code-fg: #dfe4dc; --code-cmd: #8ff0aa;
  --max: 1040px; --gutter: 9rem;
  --sans: "Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --paper: #0b0d0f; --paper-2: #121517; --ink: #e9ebe6; --ink-2: #c4c8c0; --mute: #868b86; --rule: #262a2c;
  --rust: #8fe3a3; --rust-soft: #16281d; --glow: #8ff0aa; --code-bg: #060809; --code-fg: #dfe4dc; --code-cmd: #8ff0aa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b0d0f; --paper-2: #121517; --ink: #e9ebe6; --ink-2: #c4c8c0; --mute: #868b86; --rule: #262a2c;
    --rust: #8fe3a3; --rust-soft: #16281d; --glow: #8ff0aa; --code-bg: #060809; --code-fg: #dfe4dc; --code-cmd: #8ff0aa;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 1.5rem; }
.mono { font-family: var(--mono); font-size: .84em; letter-spacing: 0; }
a { color: var(--rust); text-decoration: none; border-bottom: 1px solid transparent; }
a:hover, a:focus-visible { border-bottom-color: currentColor; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
b { font-weight: 600; } i { font-style: italic; }
code { font-family: var(--mono); font-size: .9em; }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--rust); color: #fff; padding: .5rem 1rem; z-index: 200; }
.skip-link:focus { left: 1rem; top: 1rem; }

/* header */
.top { position: sticky; top: 0; z-index: 100; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 1.5rem; min-height: 3.25rem; }
.brand { color: var(--ink); font-weight: 500; }
.top nav { display: flex; gap: 1.1rem; margin-left: auto; }
.top nav a { color: var(--ink-2); }
.top nav a:hover, .top nav a[aria-current="page"] { color: var(--rust); }
.top .nav-small { display: none; }
.toggle { background: none; border: 1px solid var(--rule); border-radius: 0; color: var(--ink-2); padding: .2rem .55rem; cursor: pointer; }
.toggle:hover { border-color: var(--rust); color: var(--rust); }
.t-dark { display: none; }
[data-theme="dark"] .t-dark { display: inline; } [data-theme="dark"] .t-light { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .t-dark { display: inline; }
  :root:not([data-theme="light"]) .t-light { display: none; }
}

/* hero (home) */
.hero { padding: 3rem 0 0; }
.hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 3rem; align-items: center; }
.kicker { color: var(--rust); margin: 0 0 .75rem; }
h1 { font-weight: 600; font-size: 3.4rem; line-height: 1.02; letter-spacing: -.025em; margin: 0 0 1.1rem; }
.lede { font-size: 1.45rem; line-height: 1.35; font-weight: 400; letter-spacing: -.01em; margin: 0 0 .6rem; color: var(--ink); }
.lede-sub { color: var(--mute); margin: 0; }
.specimen { margin: 0; }
.specimen img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }
.specimen figcaption { font-family: var(--mono); font-size: .74rem; color: var(--mute); margin-top: .5rem; line-height: 1.5; }
.sidecar { margin: 2rem 0 0; padding: 0; display: grid; gap: .25rem; border: 0; background: none; }
.sidecar > div { display: grid; grid-template-columns: var(--gutter) 1fr; gap: 1rem; }
.sidecar dt { color: var(--mute); }
.sidecar dd { margin: 0; color: var(--ink-2); }
.frieze { margin: 3rem 0 0; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
.frieze img { display: block; width: 100%; height: auto; }
[data-theme="dark"] .frieze img { filter: invert(1) brightness(1.2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .frieze img { filter: invert(1) brightness(1.2); } }
.frieze figcaption { font-family: var(--mono); font-size: .74rem; color: var(--mute); margin-top: .5rem; }

/* page heads (inner pages) */
.page-head { padding: 3rem 0 1.5rem; display: grid; grid-template-columns: var(--gutter) 1fr; gap: 1rem; }
.page-head > * { grid-column: 2; }
.page-head .kicker { grid-column: 1; grid-row: 1; margin: .55rem 0 0; }
.page-head h1 { font-size: 2.6rem; margin: 0 0 .75rem; }
.page-head .lede { font-size: 1.25rem; max-width: 62ch; }
.page-head .portrait { grid-column: 2; width: 128px; height: 128px; object-fit: cover; margin-bottom: 1rem; }

/* sections: a short green tick in the gutter, content in the column */
.sec { padding: 2.5rem 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: var(--gutter) 1fr; gap: 0 1rem; }
.sec > * { grid-column: 2; }
.sec-head { grid-column: 1 / -1; display: grid; grid-template-columns: var(--gutter) 1fr; gap: 1rem; align-items: baseline; margin-bottom: .75rem; }
.sec-head .tick { display: block; width: 2rem; height: 2px; background: var(--rust); align-self: center; }
h2 { font-weight: 600; font-size: 1.65rem; letter-spacing: -.02em; margin: 0; }
h3 { font-weight: 600; font-size: 1.05rem; letter-spacing: -.01em; margin: 0 0 .3rem; }
.intro { color: var(--ink-2); margin: 0 0 1.25rem; max-width: 64ch; }
p { margin: 0 0 1rem; }
.sec > p:last-child { margin-bottom: 0; }
.after { color: var(--ink-2); margin: 1.25rem 0 0; max-width: 70ch; }

/* research threads: ruled grid, no boxes */
.ledger { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem 1.5rem; }
.ledger li { border-top: 2px solid var(--ink); padding-top: .7rem; }
.ledger h3 { margin-bottom: .35rem; }
.ledger p { margin: 0; color: var(--ink-2); font-size: .95rem; line-height: 1.5; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem 1.5rem; }
.panel { border-top: 2px solid var(--ink); padding-top: .7rem; }
.panel p { margin: 0; color: var(--ink-2); font-size: .95rem; line-height: 1.5; }
.aims { margin: 0; padding-left: 1.4rem; }
.aims li { margin-bottom: 1rem; color: var(--ink-2); }
.aims li b { color: var(--ink); }
.aims li::marker { font-family: var(--mono); color: var(--rust); }

/* tools */
.tool-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem 2rem; }
.tool { border-top: 2px solid var(--ink); padding-top: .8rem; min-width: 0; }
.tool-head { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; margin-bottom: .6rem; }
.tool-head > a { font-weight: 500; font-size: 1rem; color: var(--ink); }
.tool-head > a:hover { color: var(--rust); }
.tool-what { color: var(--ink-2); flex: 1 1 100%; font-size: .95rem; line-height: 1.5; }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); padding: .7rem .9rem; overflow-x: auto; font-size: .78rem; line-height: 1.55; }
pre code { font-size: inherit; white-space: pre-wrap; word-break: break-word; display: block; padding-left: 1.2em; text-indent: -1.2em; }
pre code::before { content: "$ "; color: var(--code-cmd); }
.tool-note { color: var(--mute); margin: .5rem 0 0; }
.also { color: var(--ink-2); margin: 1.5rem 0 0; font-size: .95rem; }

/* papers */
.pubs { display: grid; gap: 0; }
.yr { display: grid; grid-template-columns: 4.5rem 1fr; gap: 1rem; padding: .75rem 0; border-top: 1px solid var(--rule); }
.yr-label { color: var(--rust); padding-top: .2rem; }
.yr ol { list-style: none; margin: 0; padding: 0; }
.yr li { margin-bottom: .8rem; }
.yr li:last-child { margin-bottom: 0; }
.yr li > a { color: var(--ink); font-weight: 500; line-height: 1.35; }
.yr li > a:hover { color: var(--rust); }
.meta { display: block; color: var(--mute); font-size: .88rem; margin-top: .1rem; }
.meta b { color: var(--ink-2); }
.tag { font-family: var(--mono); font-size: .7rem; color: var(--rust); border: 1px solid currentColor; padding: 0 .35rem; margin-left: .4rem; vertical-align: middle; }
.tag.role { color: var(--mute); border-color: var(--rule); }
a.ev { color: var(--ink); border-bottom: 1px solid var(--rule); }
a.ev:hover { color: var(--rust); border-bottom-color: var(--rust); }

/* tables, timeline, lists */
.tbl { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tbl th, .tbl td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl thead th { font-family: var(--mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); font-weight: 500; }
.tbl td.mono { white-space: nowrap; color: var(--rust); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 1rem; padding: .8rem 0; border-top: 1px solid var(--rule); }
.timeline .when { color: var(--rust); padding-top: .15rem; }
.timeline div { color: var(--ink-2); } .timeline b { color: var(--ink); }
.plainlist { list-style: none; margin: 0; padding: 0; }
.plainlist li { padding: .7rem 0; border-top: 1px solid var(--rule); color: var(--ink-2); }
.plainlist li b { color: var(--ink); }
.disease li a:not(.ev) { font-family: var(--mono); font-size: .8rem; margin-left: .3rem; white-space: nowrap; }

/* diagram */
.triptych { width: 100%; height: auto; margin: 1.25rem 0 .5rem; font-family: var(--mono); }
.triptych .col-label text { font-size: 12px; fill: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
.triptych .box rect { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
.triptych .box text { font-size: 13px; fill: var(--ink); }
.triptych .core rect { fill: var(--code-bg); stroke: none; }
.triptych .core text { font-size: 15px; fill: var(--glow); font-family: var(--sans); font-weight: 500; }
.triptych .core .sub { font-size: 12px; fill: var(--mute); font-family: var(--mono); font-weight: 400; }
.triptych .link path { fill: none; stroke: var(--rust); stroke-width: 1.4; }
.triptych .arr { fill: var(--rust); }
.triptych .caption { font-size: 12px; fill: var(--mute); font-family: var(--mono); }
/* trajectory */
.traj { width: 100%; height: auto; margin: .5rem 0 0; font-family: var(--mono); }
.traj .yr { display: initial; }
.traj text.yr { font-size: 11px; fill: var(--mute); }
.traj .grid { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 4; }
.traj .lbl { font-size: 12px; fill: var(--ink-2); }
.traj .dot { fill: var(--rust); opacity: .85; }
.traj .dot.abs { fill: none; stroke: var(--rust); stroke-width: 1.5; }
.traj .cap { font-size: 10.5px; fill: var(--mute); }
/* map */
.wmap { width: 100%; height: auto; margin: .25rem 0 1.5rem; }
.wmap path { stroke: var(--paper); stroke-width: .5; }
.wmap .land { fill: var(--rule); }
.wmap .home { fill: var(--ink); }
.wmap .c1 { fill: color-mix(in srgb, var(--rust) 35%, var(--paper-2)); }
.wmap .c2 { fill: color-mix(in srgb, var(--rust) 55%, var(--paper-2)); }
.wmap .c3 { fill: color-mix(in srgb, var(--rust) 75%, var(--paper-2)); }
.wmap .c4 { fill: var(--rust); }
.wmap .inset-bg { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
.wmap .inset-lbl { font-family: var(--mono); font-size: 10px; fill: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
.wmap svg path { stroke-width: .35; }

/* footer */
.foot { border-top: 1px solid var(--rule); padding: 1.5rem 0 3rem; color: var(--mute); }
.foot .wrap { display: grid; grid-template-columns: var(--gutter) 1fr; gap: 1rem; }
.foot p { grid-column: 2; margin: 0; }
.foot a { color: var(--mute); } .foot a:hover { color: var(--rust); }

/* responsive */
@media (max-width: 900px) {
  :root { --gutter: 6rem; }
  .ledger, .grid3 { grid-template-columns: repeat(2, 1fr); }
  .tool-list { grid-template-columns: 1fr; }
  .hero-grid { grid-template-columns: 1fr; gap: 1.5rem; }
}
@media (max-width: 640px) {
  :root { --gutter: 0; }
  .top nav:not(.nav-small) { display: none; }
  .top .nav-small { display: flex; gap: 1.1rem; padding: 0 1.5rem .55rem; margin-top: -.3rem; }
  .top .nav-small a { color: var(--ink-2); }
  .toggle { margin-left: auto; }
  .sec, .page-head, .foot .wrap, .sec-head, .sidecar > div { grid-template-columns: 1fr; }
  .sec-head .tick { display: none; }
  .page-head .kicker { grid-column: 1; }
  h1 { font-size: 2.3rem; } .lede { font-size: 1.15rem; } .page-head h1 { font-size: 2rem; }
  .ledger, .grid3 { grid-template-columns: 1fr; }
  .timeline li { grid-template-columns: 1fr; gap: .2rem; }
  .yr { grid-template-columns: 1fr; gap: .25rem; }
  .hero { padding-top: 2rem; }
}

html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper);}
.card{position:relative;width:1200px;height:630px;padding:60px 64px;box-sizing:border-box;display:grid;grid-template-columns:1fr 440px;gap:48px;align-items:center}
.card .kicker{font-size:18px;margin:0 0 12px}
.card h1{font-size:68px;margin:0 0 18px}
.card .lede{font-size:28px;line-height:1.3;margin:0 0 10px}
.card .sub{font-family:var(--mono);font-size:16px;color:var(--mute);margin:0}
.card img{width:440px;height:440px;object-fit:cover;display:block}
.card .cap{position:absolute;right:64px;bottom:40px;font-family:var(--mono);font-size:13px;color:var(--mute)}
.card .url{position:absolute;left:64px;bottom:44px;font-family:var(--mono);font-size:18px;color:var(--rust)}
